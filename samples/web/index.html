<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mocklane SDK web demo</title>
    <style>
      :root {
        font-family: system-ui, "Segoe UI", sans-serif;
        color: #1a1f1c;
        background: #e8efe6;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse 80% 50% at 20% 0%, #c5e0c8 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 90% 80%, #b7d4e8 0%, transparent 50%),
          #e8efe6;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.35rem;
      }
      p {
        margin: 0 0 1rem;
        color: #3d4a42;
        line-height: 1.45;
      }
      a {
        color: #1f6f4a;
      }
      .actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 0.55rem 0.9rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: #1f6f4a;
        color: #f4fff8;
      }
      button.secondary {
        background: #2c3e50;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      #scenarioList {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .scenario-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.65rem 0.75rem;
        background: #f7fbf8;
        border: 1px solid #c8d9ce;
        border-radius: 8px;
      }
      .scenario-meta {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
      }
      .scenario-path {
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
        color: #4a5c52;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      pre {
        margin: 0;
        padding: 0.9rem 1rem;
        background: #122018;
        color: #d7f5e4;
        border-radius: 8px;
        font-size: 0.8rem;
        overflow: auto;
        min-height: 6rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mocklane SDK demo</h1>
      <p>
        Same scenario catalog as Android, iOS, Flutter, and Swift CLI samples.
        Start Mocklane Desktop on <strong>:6625</strong>, then run scenarios and
        watch Traffic. Integration guide:
        <a href="https://github.com/mocklane/mocklane-sdk/blob/main/docs/integration.md"
          >INTEGRATION.md</a
        >.
      </p>
      <div class="actions">
        <button type="button" id="runAllBtn">Run all</button>
        <button type="button" id="clearBtn" class="secondary">Clear output</button>
      </div>
      <div id="scenarioList"></div>
      <pre id="out">Ready.</pre>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
